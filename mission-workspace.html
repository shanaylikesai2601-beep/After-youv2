<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AfterYou — Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0806;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: #f0ebe3;
      -webkit-font-smoothing: antialiased;
    }
    #three-container { position: fixed; inset: 0; z-index: 1; }

    /* ============================================================
       UI OVERLAY LAYERS
       ============================================================ */
    #ui-overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      padding-bottom: 5vh;
    }
    #ui-overlay::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(10,8,6,0.15) 0%, transparent 60%);
    }

    .ui-layer {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.8s ease;
      pointer-events: none;
    }
    .ui-layer.active { opacity: 1; pointer-events: auto; }
    .ui-layer.transition-out { opacity: 0; pointer-events: none; }

    /* ============================================================
       STATE: INPUT — Mission textbox + CTA
       ============================================================ */
    #state-input {
      flex-direction: column;
      gap: 0;
      text-align: center;
    }
    #state-input .eyebrow {
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(200, 160, 100, 0.4);
      margin-bottom: 12px;
      font-weight: 400;
    }
    #state-input .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 3.5vw, 48px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #f0ebe3;
      margin-bottom: 6px;
    }
    #state-input .title .highlight { color: #d4a854; }
    #state-input .subtitle {
      font-size: clamp(13px, 1vw, 16px);
      font-weight: 300;
      color: rgba(240, 235, 227, 0.4);
      margin-bottom: 28px;
    }

    .mission-input-container {
      position: relative;
      width: min(600px, 80vw);
      transition: all 0.6s ease;
    }
    .mission-input-container.dissolving {
      transform: scale(0.95);
      opacity: 0;
    }

    .mission-input {
      width: 100%;
      padding: 16px 24px;
      background: rgba(10, 8, 6, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(212, 168, 84, 0.12);
      border-radius: 14px;
      color: #f0ebe3;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(16px, 1.5vw, 22px);
      font-weight: 400;
      letter-spacing: 0.01em;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      pointer-events: auto;
    }
    .mission-input::placeholder {
      color: rgba(240, 235, 227, 0.18);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-weight: 300;
      font-size: clamp(14px, 1.3vw, 18px);
      letter-spacing: 0.02em;
    }
    .mission-input:focus {
      border-color: rgba(212, 168, 84, 0.35);
      box-shadow: 0 0 60px rgba(212, 168, 84, 0.05), inset 0 0 40px rgba(212, 168, 84, 0.015);
    }

    .mission-cta {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 11px 30px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: #d4a854;
      color: #0a0806;
      transition: background 0.2s, transform 0.15s, box-shadow 0.3s;
      pointer-events: auto;
    }
    .mission-cta:hover {
      background: #e4b864;
      transform: scale(1.03);
      box-shadow: 0 0 60px rgba(212, 168, 84, 0.15);
    }
    .mission-cta:active { transform: scale(0.97); }
    .mission-cta .key-hint {
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(10, 8, 6, 0.2);
      color: rgba(10, 8, 6, 0.5);
    }

    /* ============================================================
       STATE: EXECUTING — holographic panels
       ============================================================ */
    #state-executing {
      flex-direction: column;
      padding: 0 40px;
    }

    .exec-header {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .exec-header.visible { opacity: 1; }
    .exec-header .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(20px, 2vw, 32px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f0ebe3;
    }
    .exec-header .subtitle {
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(200, 160, 100, 0.5);
      margin-top: 6px;
    }

    /* Mission status bar */
    .mission-status-bar {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 24px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .mission-status-bar.visible { opacity: 1; }
    .mission-status-bar .status-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240, 235, 227, 0.3);
    }
    .mission-status-bar .status-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .mission-status-bar .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(212, 168, 84, 0.2);
      transition: all 0.4s ease;
    }
    .mission-status-bar .dot.active {
      background: #d4a854;
      box-shadow: 0 0 12px rgba(212, 168, 84, 0.5);
      width: 6px; height: 6px;
    }
    .mission-status-bar .dot.completed {
      background: #d4a854;
      opacity: 0.6;
    }
    .mission-status-bar .dot-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(240, 235, 227, 0.2);
      margin-top: 6px;
      text-align: center;
    }

    /* ============================================================
       STATE: COMPLETE
       ============================================================ */
    #state-complete {
      flex-direction: column;
      gap: 24px;
      text-align: center;
    }
    #state-complete .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(40px, 5vw, 72px);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #f0ebe3;
    }
    #state-complete .title .highlight { color: #d4a854; }
    #state-complete .subtitle {
      font-size: clamp(14px, 1.2vw, 18px);
      font-weight: 300;
      color: rgba(240, 235, 227, 0.5);
    }
    #state-complete .complete-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 12px;
    }
    #state-complete .btn-complete {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 12px 28px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      pointer-events: auto;
    }
    #state-complete .btn-complete.primary {
      background: #d4a854;
      color: #0a0806;
    }
    #state-complete .btn-complete.primary:hover {
      background: #e4b864;
      transform: scale(1.03);
    }
    #state-complete .btn-complete.secondary {
      background: transparent;
      border: 1px solid rgba(240, 235, 227, 0.25);
      color: #f0ebe3;
    }
    #state-complete .btn-complete.secondary:hover {
      background: rgba(240, 235, 227, 0.08);
      border-color: rgba(240, 235, 227, 0.5);
    }

    /* ============================================================
       PARTICLE CANVAS (for textbox dissolve effect)
       ============================================================ */
    #dissolve-canvas {
      position: fixed; inset: 0; z-index: 8;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* ============================================================
       REDUCED MOTION
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .ui-layer { transition: opacity 0.8s ease; }
      .mission-input, .mission-cta { transition: none; }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      #ui-overlay { padding-bottom: 8vh; }
      .mission-input {
        padding: 14px 18px;
        font-size: 15px;
      }
      .mission-input::placeholder { font-size: 14px; }
      .mission-cta { padding: 10px 24px; font-size: 12px; }
      .exec-header { top: 20px; }
      .exec-header .title { font-size: 16px; }
      .mission-status-bar { bottom: 24px; gap: 10px; flex-wrap: wrap; justify-content: center; }
    }
    @media (max-width: 480px) {
      #ui-overlay { padding-bottom: 10vh; }
      .mission-input-container { width: min(400px, 88vw); }
      .mission-input { padding: 12px 16px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <!-- Three.js container -->
  <div id="three-container"></div>

  <!-- Dissolve canvas for textbox transition -->
  <canvas id="dissolve-canvas"></canvas>

  <!-- UI Overlay -->
  <div id="ui-overlay">

    <!-- STATE: INPUT -->
    <div class="ui-layer active" id="state-input">
      <div class="mission-input-container" id="input-container">
        <p class="eyebrow">Autonomous AI Teammate</p>
        <p class="title">Assign a <span class="highlight">mission</span></p>
        <p class="subtitle">Nova plans, delegates, executes, and verifies. You just describe the outcome.</p>
        <input
          class="mission-input"
          id="mission-input"
          type="text"
          placeholder="Tell Nova what to accomplish..."
          autofocus
          spellcheck="false"
          autocomplete="off"
        />
        <div style="text-align:center;margin-top:20px;">
          <button class="mission-cta" id="mission-cta">
            Assign Mission
            <span class="key-hint">↵</span>
          </button>
        </div>
      </div>
    </div>

    <!-- STATE: EXECUTING -->
    <div class="ui-layer" id="state-executing">
      <div class="exec-header" id="exec-header">
        <p class="subtitle" id="exec-status">Nova is analyzing your mission</p>
        <p class="title" id="exec-mission-name">—</p>
      </div>
      <div class="mission-status-bar" id="status-bar">
        <span class="status-label">Progress</span>
        <div class="status-dots" id="status-dots"></div>
      </div>
    </div>

    <!-- STATE: COMPLETE -->
    <div class="ui-layer" id="state-complete">
      <div>
        <p class="title">Mission <span class="highlight">Complete</span></p>
        <p class="subtitle" id="complete-mission-name">—</p>
        <div class="complete-actions">
          <button class="btn-complete primary">View Artifact</button>
          <button class="btn-complete secondary">Open Workspace</button>
          <button class="btn-complete secondary" id="btn-new-mission">New Mission</button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ============================================================
    // STATE MACHINE
    // ============================================================
    const State = { INPUT: 'input', TRANSITIONING: 'transitioning', EXECUTING: 'executing', COMPLETE: 'complete' };
    let currentState = State.INPUT;
    let stateTime = 0;

    const layers = {
      input: document.getElementById('state-input'),
      executing: document.getElementById('state-executing'),
      complete: document.getElementById('state-complete'),
    };
    const inputEl = document.getElementById('mission-input');
    const ctaBtn = document.getElementById('mission-cta');
    const inputContainer = document.getElementById('input-container');
    const execHeader = document.getElementById('exec-header');
    const execStatus = document.getElementById('exec-status');
    const execMissionName = document.getElementById('exec-mission-name');
    const statusDots = document.getElementById('status-dots');
    const statusBar = document.getElementById('status-bar');
    const completeMissionName = document.getElementById('complete-mission-name');
    const dissolveCanvas = document.getElementById('dissolve-canvas');
    const dCtx = dissolveCanvas.getContext('2d');

    // ============================================================
    // THREE.JS SETUP
    // ============================================================
    const container = document.getElementById('three-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0806);
    scene.fog = new THREE.FogExp2(0x0a0806, 0.018);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    const dpr = window.devicePixelRatio;
    const cores = navigator.hardwareConcurrency || 4;
    const isLow = dpr <= 1 && cores <= 2;
    const isMedium = !isLow && (dpr <= 1.5 || cores <= 4);
    const isUltra = dpr > 2 && cores > 8;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isUltra ? 1.5 : 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.setSize(window.innerWidth, window.innerHeight);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(Math.floor(window.innerWidth / 2), Math.floor(window.innerHeight / 2)),
      0.6, 0.3, 0.15
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // ============================================================
    // LIGHTING
    // ============================================================
    const ambientLight = new THREE.AmbientLight(0x1a1410, 0.3);
    scene.add(ambientLight);
    const keyLight = new THREE.PointLight(0xd4a854, 0, 8);
    keyLight.position.set(0, 0.5, 0);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xd4a854, 0.15);
    rimLight.position.set(2, 4, -3);
    scene.add(rimLight);
    const fillLight = new THREE.DirectionalLight(0x8a7a6a, 0.08);
    fillLight.position.set(-3, 1, 4);
    scene.add(fillLight);
    const topLight = new THREE.DirectionalLight(0xd4a854, 0.05);
    topLight.position.set(0, 5, 0);
    scene.add(topLight);
    const warmFill = new THREE.PointLight(0xc9944a, 0, 10);
    warmFill.position.set(0, 2, -2);
    scene.add(warmFill);
    const backLight = new THREE.DirectionalLight(0xd4a854, 0.03);
    backLight.position.set(0, -2, -5);
    scene.add(backLight);

    // ============================================================
    // ENVIRONMENT
    // ============================================================
    const roomSize = 24;
    const roomGeo = new THREE.BoxGeometry(roomSize, roomSize, roomSize);
    const roomMat = new THREE.MeshStandardMaterial({ color: 0x0a0806, roughness: 0.9, metalness: 0.0, side: THREE.BackSide });
    scene.add(new THREE.Mesh(roomGeo, roomMat));
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x12100a, roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.8 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.8;
    scene.add(floor);

    // ============================================================
    // DUST PARTICLES
    // ============================================================
    const DUST_COUNT = 600;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(DUST_COUNT * 3);
    for (let i = 0; i < DUST_COUNT; i++) {
      const i3 = i * 3;
      dustPos[i3] = (Math.random() - 0.5) * 12;
      dustPos[i3 + 1] = (Math.random() - 0.5) * 6;
      dustPos[i3 + 2] = (Math.random() - 0.5) * 12;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      size: 0.01, color: 0xd4a854, transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    const dustParticles = new THREE.Points(dustGeo, dustMat);
    scene.add(dustParticles);

    // ============================================================
    // NOVA — AI CRYSTALLINE FORM (reused EXACTLY from landing page)
    // ============================================================
    const aiFormGroup = new THREE.Group();
    aiFormGroup.position.set(0, 1.5, 0);

    const outerCrystalMat = new THREE.MeshPhysicalMaterial({
      color: 0xd4a854, emissive: 0xd4a854, emissiveIntensity: 0.15,
      metalness: 0.3, roughness: 0.2, transparent: true, opacity: 0.5,
      clearcoat: 0.3, clearcoatRoughness: 0.2, envMapIntensity: 0.5, wireframe: false
    });
    const outerCrystal = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0, 1), outerCrystalMat);
    aiFormGroup.add(outerCrystal);

    const midCrystalMat = new THREE.MeshPhysicalMaterial({
      color: 0xe8c470, emissive: 0xd4a854, emissiveIntensity: 0.3,
      metalness: 0.5, roughness: 0.15, transparent: true, opacity: 0.6,
      clearcoat: 0.4, clearcoatRoughness: 0.15
    });
    const midCrystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.7, 0), midCrystalMat);
    aiFormGroup.add(midCrystal);

    const innerCoreMat = new THREE.MeshBasicMaterial({
      color: 0xffe8b0, transparent: true, opacity: 0.15
    });
    const innerCore = new THREE.Mesh(new THREE.TetrahedronGeometry(0.4, 0), innerCoreMat);
    aiFormGroup.add(innerCore);

    const wireframeMat = new THREE.MeshBasicMaterial({
      color: 0xe8c470, wireframe: true, transparent: true, opacity: 0.12
    });
    const wireframe = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3, 0), wireframeMat);
    aiFormGroup.add(wireframe);
    scene.add(aiFormGroup);

    // ============================================================
    // HOLOGRAPHIC RINGS
    // ============================================================
    const ringGroup = new THREE.Group();
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xd4a854, transparent: true, opacity: 0.08, side: THREE.DoubleSide
    });
    for (let i = 0; i < 3; i++) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(1.3 + i * 0.3, 1.35 + i * 0.3, 64), ringMat.clone());
      ring.material.opacity = 0.04 + i * 0.02;
      ring.rotation.x = Math.PI / 2 + (i * 0.3);
      ring.rotation.z = i * 0.5;
      ringGroup.add(ring);
    }
    scene.add(ringGroup);

    // ============================================================
    // PARTICLES (icosahedron formation)
    // ============================================================
    const PARTICLE_COUNT = isUltra ? 6000 : 4000;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const targets = new Float32Array(PARTICLE_COUNT * 3);
    const origins = new Float32Array(PARTICLE_COUNT * 3);
    const icoGeo = new THREE.IcosahedronGeometry(1.4, 1);
    const icoPos = icoGeo.attributes.position.array;
    const icoVerts = [];
    for (let i = 0; i < icoPos.length; i += 3) {
      icoVerts.push(new THREE.Vector3(icoPos[i], icoPos[i+1], icoPos[i+2]));
    }
    const warmColors = [
      new THREE.Color(0xd4a854), new THREE.Color(0xc9944a),
      new THREE.Color(0xe8c470), new THREE.Color(0xb8843a),
      new THREE.Color(0xf0d490), new THREE.Color(0xa07030)
    ];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const radius = 0.3 + Math.random() * 4;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      origins[i3] = Math.sin(phi) * Math.cos(theta) * radius;
      origins[i3 + 1] = Math.sin(phi) * Math.sin(theta) * radius * 0.5 + 0.5;
      origins[i3 + 2] = Math.cos(phi) * radius;
      positions[i3] = origins[i3];
      positions[i3 + 1] = origins[i3 + 1];
      positions[i3 + 2] = origins[i3 + 2];
      const vert = icoVerts[i % icoVerts.length];
      targets[i3] = vert.x * (0.8 + Math.random() * 0.4);
      targets[i3 + 1] = vert.y * (0.8 + Math.random() * 0.4) + 0.5;
      targets[i3 + 2] = vert.z * (0.8 + Math.random() * 0.4);
      sizes[i] = 0.02 + Math.random() * 0.06;
      const c = warmColors[Math.floor(Math.random() * warmColors.length)];
      colors[i3] = c.r; colors[i3 + 1] = c.g; colors[i3 + 2] = c.b;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const particleMat = new THREE.PointsMaterial({
      size: 0.04, vertexColors: true, transparent: true, opacity: 0.6,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    particles.position.set(0, 0.5, 0);
    scene.add(particles);

    // ============================================================
    // DATA STREAM PARTICLES
    // ============================================================
    const STREAM_COUNT = 2000;
    const streamGeo = new THREE.BufferGeometry();
    const streamPos = new Float32Array(STREAM_COUNT * 3);
    const streamCol = new Float32Array(STREAM_COUNT * 3);
    const streamSizes = new Float32Array(STREAM_COUNT);
    const streamLife = new Float32Array(STREAM_COUNT);
    const streamOrig = new Float32Array(STREAM_COUNT * 3);
    const streamTarg = new Float32Array(STREAM_COUNT * 3);
    for (let i = 0; i < STREAM_COUNT; i++) {
      const i3 = i * 3;
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.5 + Math.random() * 3;
      const height = (Math.random() - 0.5) * 4;
      streamPos[i3] = Math.cos(angle) * radius;
      streamPos[i3 + 1] = height + 1.5;
      streamPos[i3 + 2] = Math.sin(angle) * radius;
      streamOrig[i3] = streamPos[i3];
      streamOrig[i3 + 1] = streamPos[i3 + 1];
      streamOrig[i3 + 2] = streamPos[i3 + 2];
      streamTarg[i3] = Math.cos(angle + 0.5) * (radius * 0.3);
      streamTarg[i3 + 1] = height + 1.5 + (Math.random() - 0.5) * 2;
      streamTarg[i3 + 2] = Math.sin(angle + 0.5) * (radius * 0.3);
      const c = warmColors[Math.floor(Math.random() * warmColors.length)];
      streamCol[i3] = c.r * 0.8; streamCol[i3 + 1] = c.g * 0.8; streamCol[i3 + 2] = c.b * 0.8;
      streamSizes[i] = 0.015 + Math.random() * 0.04;
      streamLife[i] = Math.random();
    }
    streamGeo.setAttribute('position', new THREE.BufferAttribute(streamPos, 3));
    streamGeo.setAttribute('color', new THREE.BufferAttribute(streamCol, 3));
    streamGeo.setAttribute('size', new THREE.BufferAttribute(streamSizes, 1));
    const streamMat = new THREE.PointsMaterial({
      size: 0.03, vertexColors: true, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    const streamParticles = new THREE.Points(streamGeo, streamMat);
    scene.add(streamParticles);

    // ============================================================
    // HOLOGRAPHIC AGENT PANELS
    // ============================================================
    const agents = [
      { id: 'planner', label: 'Planner', color: '#d4a854', data: [
        'Mission breakdown', '8 tasks remaining', 'Current reasoning: analyzing dependencies',
        'Est. completion: 2m 14s', 'Confidence: 94%'
      ]},
      { id: 'research', label: 'Research', color: '#e8c470', data: [
        'Searching: latest API docs', 'Sources visited: 12', 'Evidence collected: 47 items',
        'Current: scanning Stack Overflow', 'Confidence: 87%'
      ]},
      { id: 'browser', label: 'Browser', color: '#c9944a', data: [
        'URL: https://docs.example.com/api', 'Tabs visited: 6', 'DOM parsed: 1,240 nodes',
        'Extracted: 3 code examples', 'Status: navigating'
      ]},
      { id: 'coding', label: 'Coding', color: '#f0d490', data: [
        'File: src/mission-orchestrator.ts', 'Files edited: 4', 'Functions created: 7',
        'Lines changed: +284 / -62', 'Build: compiling...'
      ]},
      { id: 'terminal', label: 'Terminal', color: '#b8843a', data: [
        '$ npm run build', '$ npm run lint', '$ npm run typecheck',
        '$ git status', 'Build: 12/14 modules'
      ]},
      { id: 'reviewer', label: 'Reviewer', color: '#d4a854', data: [
        'Quality score: 92/100', 'Warnings: 3 minor', 'Review cycles: 1',
        'Style: consistent', 'Approval: pending'
      ]},
      { id: 'document', label: 'Document', color: '#e8c470', data: [
        'Generating PDF...', 'Embedding citations', 'Creating artifact',
        'Saving report', 'Formatting: 80%'
      ]},
      { id: 'github', label: 'GitHub', color: '#c9944a', data: [
        'Branch: feat/mission-orchestrator', 'Files modified: 12',
        'Commit prepared', 'Push: pending', 'PR: draft ready'
      ]},
    ];

    const panelGroup = new THREE.Group();
    const panelMeshes = [];
    const panelCanvasTextures = [];
    const panelCanvasStates = [];

    function createPanelCanvas(agent) {
      const c = document.createElement('canvas');
      c.width = 320; c.height = 240;
      const ctx = c.getContext('2d');
      return { canvas: c, ctx, agent, dataIdx: 0, dataTimer: 0 };
    }

    function renderPanelCanvas(state) {
      const { canvas, ctx, agent } = state;
      const w = 320, h = 240;
      ctx.clearRect(0, 0, w, h);

      // Glass background
      const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.7);
      grad.addColorStop(0, agent.color + '15');
      grad.addColorStop(1, agent.color + '02');
      ctx.fillStyle = 'rgba(10, 8, 6, 0.5)';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Border glow
      ctx.strokeStyle = agent.color + '40';
      ctx.lineWidth = 1;
      ctx.strokeRect(1, 1, w - 2, h - 2);

      // Top accent line
      ctx.fillStyle = agent.color + '60';
      ctx.fillRect(0, 0, w, 1);

      // Agent label
      ctx.fillStyle = agent.color + 'cc';
      ctx.font = '600 10px "Inter", system-ui, sans-serif';
      ctx.letterSpacing = '0.2em';
      ctx.fillText(agent.label.toUpperCase(), 16, 22);

      // Separator
      ctx.fillStyle = agent.color + '20';
      ctx.fillRect(16, 30, w - 32, 1);

      // Data lines
      const data = agent.data;
      ctx.font = '300 10px "JetBrains Mono", monospace';
      data.forEach((line, i) => {
        const y = 52 + i * 22;
        const isDim = line.startsWith('$') || line.startsWith('Status:');
        ctx.fillStyle = isDim ? agent.color + '50' : agent.color + '90';
        ctx.fillText(line, 16, y);
      });

      // Progress dots
      for (let i = 0; i < 5; i++) {
        const dx = w - 40 + i * 8;
        const dy = 18;
        ctx.fillStyle = i < 3 ? agent.color + '80' : agent.color + '20';
        ctx.beginPath();
        ctx.arc(dx, dy, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Pulse ring
      const pulse = Math.sin(state.dataTimer * 2) * 0.3 + 0.5;
      ctx.strokeStyle = agent.color + Math.floor(pulse * 15).toString(16).padStart(2, '0');
      ctx.lineWidth = 1;
      ctx.strokeRect(2, 2, w - 4, h - 4);
    }

    function buildPanelMeshes() {
      agents.forEach((agent, i) => {
        const state = createPanelCanvas(agent);
        renderPanelCanvas(state);
        panelCanvasStates.push(state);

        const tex = new THREE.CanvasTexture(state.canvas);
        tex.needsUpdate = true;
        panelCanvasTextures.push(tex);

        const mat = new THREE.MeshBasicMaterial({
          map: tex, transparent: true, opacity: 0,
          side: THREE.DoubleSide, depthWrite: false
        });

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.9), mat);

        const angle = (i / agents.length) * Math.PI * 2;
        const radius = 2.8 + Math.random() * 0.6;
        const height = 1.0 + Math.random() * 1.8;
        const tilt = (Math.random() - 0.5) * 0.4;

        mesh.position.set(
          Math.cos(angle) * radius,
          height,
          Math.sin(angle) * radius
        );
        mesh.lookAt(0, 1.5, 0);
        mesh.rotation.x += tilt;

        panelGroup.add(mesh);
        panelMeshes.push({
          mesh, angle, radius, height, tilt, speed: 0.08 + Math.random() * 0.06,
          phase: Math.random() * Math.PI * 2, tex, mat, state, agent,
          connectionLine: null, opacity: 0, visible: false
        });
      });
    }
    buildPanelMeshes();
    scene.add(panelGroup);

    // Network lines from Nova to each panel
    const connectionLines = [];
    panelMeshes.forEach((p) => {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 1.5, 0),
        p.mesh.position.clone()
      ]);
      const mat = new THREE.LineBasicMaterial({
        color: new THREE.Color(p.agent.color),
        transparent: true, opacity: 0
      });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      connectionLines.push({ line, mesh: p.mesh, mat });
    });

    // ============================================================
    // CAMERA — cinematic drift
    // ============================================================
    const cameraBase = new THREE.Vector3(0, 1.5, 5);
    const cameraTarget = new THREE.Vector3(0, 1.5, 0);
    let cameraDriftPhase = 0;

    function updateCamera(time, dt) {
      cameraDriftPhase += dt * 0.08;

      if (currentState === State.INPUT) {
        // Slow breathing orbit — closer to Nova
        const orbitX = Math.sin(cameraDriftPhase * 0.3) * 0.4;
        const orbitY = Math.sin(cameraDriftPhase * 0.2) * 0.25;
        const orbitZ = Math.cos(cameraDriftPhase * 0.3) * 0.4;
        camera.position.x = orbitX;
        camera.position.y = 1.5 + orbitY;
        camera.position.z = 5 + orbitZ;
        camera.lookAt(0, 1.5, 0);
      } else if (currentState === State.TRANSITIONING) {
        // Push forward toward Nova
        const t = Math.min(1, stateTime / 2.5);
        const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
        camera.position.x *= (1 - ease * 0.3);
        camera.position.y += ease * 0.2;
        camera.position.z = 5 - ease * 2;
        camera.lookAt(0, 1.5 + ease * 0.3, 0);
      } else if (currentState === State.EXECUTING) {
        // Slow orbit around Nova — closer
        const orbitAngle = cameraDriftPhase * 0.15;
        const orbitRadius = 3.5 + Math.sin(cameraDriftPhase * 0.1) * 0.4;
        const orbitY = 1.5 + Math.sin(cameraDriftPhase * 0.12) * 0.5;
        camera.position.x = Math.sin(orbitAngle) * orbitRadius;
        camera.position.z = Math.cos(orbitAngle) * orbitRadius;
        camera.position.y = orbitY;
        camera.lookAt(0, 1.5, 0);
      } else if (currentState === State.COMPLETE) {
        // Pull back slightly, settle
        const settleAngle = cameraDriftPhase * 0.05;
        camera.position.x = Math.sin(settleAngle) * 4;
        camera.position.z = Math.cos(settleAngle) * 4;
        camera.position.y = 1.8 + Math.sin(cameraDriftPhase * 0.08) * 0.2;
        camera.lookAt(0, 1.5, 0);
      }
    }

    // ============================================================
    // MOUSE PARALLAX
    // ============================================================
    const mouse = new THREE.Vector2(0, 0);
    let mouseTarget = new THREE.Vector2(0, 0);
    document.addEventListener('mousemove', (e) => {
      mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseTarget.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // ============================================================
    // STATE TRANSITION FUNCTIONS
    // ============================================================
    let dissolveParticles = [];
    let dissolvePhase = 0;

    function startMission() {
      const missionText = inputEl.value.trim() || 'Untitled mission';
      execMissionName.textContent = missionText;
      execStatus.textContent = 'Nova is analyzing your mission';
      completeMissionName.textContent = missionText;

      // Capture input area for dissolve
      const rect = inputContainer.getBoundingClientRect();
      dissolveCanvas.width = window.innerWidth;
      dissolveCanvas.height = window.innerHeight;
      dissolveParticles = [];
      dissolvePhase = 0;

      // Sample pixels from the input area
      const sampleCount = 200;
      for (let i = 0; i < sampleCount; i++) {
        dissolveParticles.push({
          x: rect.left + Math.random() * rect.width,
          y: rect.top + Math.random() * rect.height,
          targetX: (Math.random() - 0.5) * 2,
          targetY: 0.5 + Math.random() * 2,
          targetZ: (Math.random() - 0.5) * 2,
          size: 1 + Math.random() * 3,
          speed: 0.3 + Math.random() * 0.4,
          progress: 0,
          color: `rgba(212, ${168 + Math.random() * 40}, ${84 + Math.random() * 40}, ${0.3 + Math.random() * 0.5})`
        });
      }

      // Switch state
      setState(State.TRANSITIONING);
      inputContainer.classList.add('dissolving');

      // After transition, start execution
      setTimeout(() => {
        setState(State.EXECUTING);
        animatePanelsIn();
      }, 2500);
    }

    function setState(newState) {
      Object.keys(layers).forEach((key) => {
        layers[key].classList.toggle('active', key === newState);
      });
      currentState = newState;
      stateTime = 0;
    }

    function animatePanelsIn() {
      execHeader.classList.add('visible');
      statusBar.classList.add('visible');

      // Build status dots
      statusDots.innerHTML = '';
      agents.forEach((a, i) => {
        const dotGroup = document.createElement('div');
        dotGroup.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;';
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.dataset.index = i;
        dotGroup.appendChild(dot);
        const label = document.createElement('div');
        label.className = 'dot-label';
        label.textContent = a.label;
        dotGroup.appendChild(label);
        statusDots.appendChild(dotGroup);
      });

      // Reveal panels one by one
      let revealTime = 0;
      panelMeshes.forEach((p, i) => {
        setTimeout(() => {
          p.visible = true;
          p.mesh.material.opacity = 0;
          p.mat.transparent = true;
          connectionLines[i].mat.opacity = 0.12;
          animatePanelIn(p, i);
          updateStatusDot(i, 'active');
        }, 800 + i * 400);
      });

      // Complete panels one by one
      let completeIdx = 0;
      const completeInterval = setInterval(() => {
        if (completeIdx >= panelMeshes.length) {
          clearInterval(completeInterval);
          setTimeout(() => completeMission(), 1200);
          return;
        }
        updateStatusDot(completeIdx, 'completed');
        panelMeshes[completeIdx].mesh.material.color.setHex(0xd4a854);
        completeIdx++;
      }, 2200);
    }

    function animatePanelIn(p, idx) {
      const startTime = performance.now();
      const duration = 1000;
      function tick() {
        const t = Math.min(1, (performance.now() - startTime) / duration);
        const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
        p.mesh.material.opacity = ease * 0.85;
        p.mat.opacity = p.mesh.material.opacity;
        p.mesh.scale.setScalar(0.3 + ease * 0.7);
        if (t < 1) requestAnimationFrame(tick);
      }
      tick();
    }

    function updateStatusDot(idx, status) {
      const dots = document.querySelectorAll('.dot');
      if (dots[idx]) {
        dots[idx].className = 'dot ' + status;
      }
    }

    function completeMission() {
      setState(State.COMPLETE);
      // Brighten Nova
      const intensity = 0.15 + 0.6;
      outerCrystalMat.emissiveIntensity = 0.75;
      midCrystalMat.emissiveIntensity = 0.9;
      bloomPass.strength = 1.0;

      // Fade panels out
      panelMeshes.forEach((p) => {
        p.mesh.material.opacity = 0;
      });
      connectionLines.forEach((cl) => { cl.mat.opacity = 0; });
    }

    // ============================================================
    // INPUT HANDLING
    // ============================================================
    function handleMissionSubmit() {
      if (currentState === State.INPUT) {
        startMission();
      }
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleMissionSubmit();
      }
    });

    ctaBtn.addEventListener('click', handleMissionSubmit);

    document.getElementById('btn-new-mission')?.addEventListener('click', () => {
      // Reset
      setState(State.INPUT);
      inputEl.value = '';
      inputContainer.classList.remove('dissolving');
      panelMeshes.forEach((p) => {
        p.mesh.material.opacity = 0;
        p.mesh.scale.setScalar(1);
      });
      connectionLines.forEach((cl) => { cl.mat.opacity = 0; });
      outerCrystalMat.emissiveIntensity = 0.15;
      midCrystalMat.emissiveIntensity = 0.3;
      bloomPass.strength = 0.6;
      statusDots.innerHTML = '';
      execHeader.classList.remove('visible');
      statusBar.classList.remove('visible');
      dissolveParticles = [];
    });

    // ============================================================
    // DISSOLVE CANVAS RENDER
    // ============================================================
    function renderDissolve(time) {
      if (currentState !== State.TRANSITIONING || dissolveParticles.length === 0) {
        dissolveCanvas.style.opacity = '0';
        return;
      }

      dissolvePhase += 0.016;
      dissolveCanvas.style.opacity = '1';
      dCtx.clearRect(0, 0, dissolveCanvas.width, dissolveCanvas.height);

      let allDone = true;
      dissolveParticles.forEach((p) => {
        p.progress += p.speed * 0.016;
        if (p.progress < 1) {
          allDone = false;
          const t = p.progress;
          const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
          const x = p.x + p.targetX * 60 * ease;
          const y = p.y - p.targetY * 40 * ease;
          const size = p.size * (1 - ease * 0.7);
          dCtx.fillStyle = p.color;
          dCtx.globalAlpha = 1 - ease;
          dCtx.beginPath();
          dCtx.arc(x, y, size, 0, Math.PI * 2);
          dCtx.fill();
        }
      });

      if (allDone) {
        dissolveCanvas.style.opacity = '0';
      }
    }

    // ============================================================
    // AGENT PANEL DATA ANIMATION
    // ============================================================
    let panelDataTimer = 0;

    function updatePanelData(dt) {
      panelDataTimer += dt;
      panelCanvasStates.forEach((state, i) => {
        state.dataTimer += dt;
        if (state.dataTimer > 3) {
          state.dataTimer = 0;
          // Rotate data lines
          const first = state.agent.data.shift();
          state.agent.data.push(first);
        }
        renderPanelCanvas(state);
        panelCanvasTextures[i].needsUpdate = true;
      });
    }

    // ============================================================
    // ANIMATION LOOP
    // ============================================================
    const clock = new THREE.Clock();
    let termScroll = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;
      stateTime += dt;

      // ---- CAMERA ----
      updateCamera(time, dt);

      // ---- MOUSE PARALLAX ----
      if (currentState === State.INPUT) {
        mouse.x += (mouseTarget.x - mouse.x) * 0.05;
        mouse.y += (mouseTarget.y - mouse.y) * 0.05;
        camera.position.x += mouse.x * 0.2;
        camera.position.y += mouse.y * 0.15;
      }

      // ---- LIGHTING ----
      const baseIntensity = currentState === State.COMPLETE ? 3.5 :
                            currentState === State.EXECUTING ? 3.0 :
                            currentState === State.TRANSITIONING ? 2.5 : 1.5;
      keyLight.intensity = baseIntensity + Math.sin(time * 1.5) * 0.5;
      warmFill.intensity = 0.5 + Math.sin(time * 1.5) * 0.3;

      // ---- BLOOM ----
      bloomPass.strength = currentState === State.COMPLETE ? 1.0 :
                           currentState === State.EXECUTING ? 0.8 :
                           currentState === State.TRANSITIONING ? 0.7 : 0.5;

      // ---- FOG ----
      scene.fog.density = 0.018;

      // ---- DUST ----
      const dustPosAttr = dustGeo.attributes.position;
      const dustArr = dustPosAttr.array;
      for (let i = 0; i < DUST_COUNT; i++) {
        const i3 = i * 3;
        dustArr[i3 + 1] += Math.sin(time * 0.1 + i) * 0.0001;
        dustArr[i3] += Math.cos(time * 0.08 + i * 0.5) * 0.0001;
      }
      dustPosAttr.needsUpdate = true;
      dustMat.opacity = 0.08 + Math.sin(time * 0.3) * 0.05;

      // ---- NOVA CRYSTAL ----
      outerCrystalMat.opacity = 0.5 + Math.sin(time * 1.5) * 0.05;
      outerCrystalMat.emissiveIntensity = 0.15 + Math.sin(time * 1.5) * 0.1;
      outerCrystal.rotation.x = time * 0.2;
      outerCrystal.rotation.y = time * 0.4;
      outerCrystal.scale.setScalar(1 + Math.sin(time * 1.5) * 0.05);

      midCrystalMat.opacity = 0.6 + Math.sin(time * 2.0) * 0.05;
      midCrystalMat.emissiveIntensity = 0.3 + Math.sin(time * 2.0) * 0.15;
      midCrystal.rotation.x = time * -0.5;
      midCrystal.rotation.y = time * -0.7;
      midCrystal.scale.setScalar(1 + Math.sin(time * 2.5) * 0.08);

      innerCoreMat.opacity = 0.15 + Math.sin(time * 3) * 0.05;
      innerCore.rotation.x = time * 0.8;
      innerCore.rotation.y = time * 1.2;
      innerCore.scale.setScalar(1 + Math.sin(time * 3) * 0.15);

      wireframe.material.opacity = 0.12 + Math.sin(time * 1.2) * 0.04;
      wireframe.rotation.x = time * 0.15 + 0.5;
      wireframe.rotation.y = time * 0.3 + 0.3;
      wireframe.scale.setScalar((1 + Math.sin(time * 1.5) * 0.05) * 1.15);

      // ---- RINGS ----
      ringGroup.position.set(0, 1.5 + Math.sin(time * 0.3) * 0.05, 0);
      ringGroup.children.forEach((ring, i) => {
        ring.material.opacity = 0.04 + i * 0.02 + Math.sin(time * 0.5 + i) * 0.01;
        ring.rotation.z = time * (0.2 + i * 0.1);
        ring.rotation.x = Math.PI / 2 + (i * 0.3) + Math.sin(time * 0.5 + i) * 0.05;
      });

      // ---- PARTICLES ----
      const posAttr = particleGeo.attributes.position;
      const posArray = posAttr.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const idle = Math.sin(time * 0.5 + i * 0.01) * 0.02;
        posArray[i3] = targets[i3] + idle;
        posArray[i3 + 1] = targets[i3 + 1] + Math.sin(time * 0.7 + i * 0.015) * 0.02;
        posArray[i3 + 2] = targets[i3 + 2] + Math.cos(time * 0.6 + i * 0.012) * 0.02;
      }
      posAttr.needsUpdate = true;
      particleMat.opacity = 0.6;

      // ---- DATA STREAMS ----
      const sPos = streamGeo.attributes.position.array;
      for (let i = 0; i < STREAM_COUNT; i++) {
        const i3 = i * 3;
        streamLife[i] += dt * (0.5 + Math.random() * 0.5);
        if (streamLife[i] > 1) {
          streamLife[i] = 0;
          const angle = Math.random() * Math.PI * 2;
          const radius = 0.5 + Math.random() * 3;
          sPos[i3] = Math.cos(angle) * radius;
          sPos[i3 + 1] = -1 + Math.random() * 0.5;
          sPos[i3 + 2] = Math.sin(angle) * radius;
          streamOrig[i3] = sPos[i3];
          streamOrig[i3 + 1] = sPos[i3 + 1];
          streamOrig[i3 + 2] = sPos[i3 + 2];
          streamTarg[i3] = Math.cos(angle + 0.3) * (radius * 0.2);
          streamTarg[i3 + 1] = 3 + Math.random() * 2;
          streamTarg[i3 + 2] = Math.sin(angle + 0.3) * (radius * 0.2);
        }
        const t = streamLife[i];
        const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
        sPos[i3] = streamOrig[i3] + (streamTarg[i3] - streamOrig[i3]) * ease;
        sPos[i3 + 1] = streamOrig[i3 + 1] + (streamTarg[i3 + 1] - streamOrig[i3 + 1]) * ease;
        sPos[i3 + 2] = streamOrig[i3 + 2] + (streamTarg[i3 + 2] - streamOrig[i3 + 2]) * ease;
      }
      streamGeo.attributes.position.needsUpdate = true;

      // ---- HOLOGRAPHIC PANELS ----
      if (currentState === State.EXECUTING) {
        panelMeshes.forEach((p) => {
          const angle = p.angle + time * p.speed;
          const radius = p.radius + Math.sin(time * p.speed * 0.5 + p.phase) * 0.15;
          const height = p.height + Math.sin(time * p.speed * 0.7 + p.phase) * 0.15;

          p.mesh.position.x = Math.cos(angle) * radius;
          p.mesh.position.z = Math.sin(angle) * radius;
          p.mesh.position.y = height;

          p.mesh.lookAt(0, 1.5, 0);
          p.mesh.rotation.x += p.tilt + Math.sin(time * 0.3 + p.phase) * 0.02;

          // Update connection lines
          const idx = panelMeshes.indexOf(p);
          if (connectionLines[idx]) {
            const positions = connectionLines[idx].line.geometry.attributes.position.array;
            positions[3] = p.mesh.position.x;
            positions[4] = p.mesh.position.y;
            positions[5] = p.mesh.position.z;
            connectionLines[idx].line.geometry.attributes.position.needsUpdate = true;
            connectionLines[idx].mat.opacity = 0.08 + Math.sin(time * 2 + p.phase) * 0.04;
          }
        });
      }

      // ---- PANEL DATA UPDATES ----
      if (currentState === State.EXECUTING) {
        updatePanelData(dt);
      }

      // ---- DISSOLVE ----
      renderDissolve(time);

      composer.render();
    }

    animate();

    // ============================================================
    // RESIZE
    // ============================================================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      dissolveCanvas.width = w;
      dissolveCanvas.height = h;
    });

    // ============================================================
    // FOCUS INPUT
    // ============================================================
    setTimeout(() => { inputEl.focus(); }, 500);
  </script>
</body>
</html>
