<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowboard — Kanban</title><style>
:root{--ink:#20232a;--muted:#667085;--paper:#f7f8fa;--line:#e5e7eb;--accent:#635bff;--dark:#171b2b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}.app{min-height:100vh}.top{height:64px;display:flex;align-items:center;gap:22px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:800;letter-spacing:-.04em}.brand i{color:var(--accent);font-style:normal}.crumb{color:var(--muted)}.spacer{flex:1}.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#ede9fe;color:#5b21b6;font-weight:700}.shell{padding:36px clamp(20px,5vw,72px)}.board-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.board-head h1{margin:0;font-size:28px;letter-spacing:-.045em}.board-head p{margin:5px 0 0;color:var(--muted)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:white;font:600 13px inherit;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:18px;overflow:auto;padding-bottom:20px}.column{min-height:510px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#edf0f4}.column-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px;font-weight:700}.count{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#dce0e7;color:var(--muted);font-size:11px}.cards{min-height:440px}.card{margin:10px 0;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 1px 2px #1018280d;cursor:grab}.card:active{cursor:grabbing}.card.dragging{opacity:.45}.label{display:inline-block;padding:3px 7px;border-radius:99px;background:#e0e7ff;color:#4338ca;font-size:10px;font-weight:700}.label.design{background:#fce7f3;color:#be185d}.label.bug{background:#fee2e2;color:#b91c1c}.card h3{margin:10px 0 12px;font-size:14px}.card-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.drop{outline:2px solid #a5b4fc;outline-offset:2px}.login{display:none;min-height:100vh;place-items:center;background:linear-gradient(135deg,#171b2b,#38316d)}.login.active{display:grid}.login-card{width:min(400px,calc(100% - 40px));padding:34px;border-radius:20px;background:#fff;box-shadow:0 20px 60px #0004}.login h1{margin:0;font-size:28px}.login p{color:var(--muted)}.login input{width:100%;margin:8px 0 18px;padding:12px;border:1px solid var(--line);border-radius:9px}@media(max-width:800px){.top{padding:0 18px}.shell{padding:24px 18px}.board{grid-template-columns:repeat(4,280px)}.board-head{align-items:start;flex-direction:column}}
</style></head><body><section class="login" id="login"><form class="login-card" id="login-form"><h1>Welcome to Flowboard</h1><p>Sign in to organise your team’s best work.</p><label>Email<input type="email" value="alex@flowboard.dev" required></label><label>Password<input type="password" value="demo-password" required></label><button type="submit">Continue to board</button></form></section><main class="app" id="app"><header class="top"><div class="brand">flow<i>board</i></div><div class="crumb">Engineering / Product launch</div><div class="spacer"></div><button id="signout">Sign out</button><div class="avatar">AP</div></header><section class="shell"><div class="board-head"><div><h1>Product launch</h1><p>Ship a focused first release, together.</p></div><button id="add">+ Add card</button></div><div class="board" id="board"></div></section></main><script>
const initial={todo:[['Audit onboarding flow','design','Today'],['Write public API docs','engineering','Thu']],progress:[['Build workspace picker','engineering','Today'],['Review mobile navigation','design','Fri']],review:[['QA checkout states','bug','Tomorrow']],done:[['Define launch narrative','design','Done']]};const titles={todo:'To do',progress:'In progress',review:'Review',done:'Done'};let state=JSON.parse(localStorage.getItem('flowboard')||'null')||initial;const board=document.querySelector('#board');function render(){board.innerHTML=Object.entries(titles).map(([id,title])=>`<section class="column" data-column="${id}"><div class="column-head"><span>${title}</span><span class="count">${state[id].length}</span></div><div class="cards">${state[id].map((c,i)=>`<article class="card" draggable="true" data-index="${i}" data-column="${id}"><span class="label ${c[1]}">${c[1]}</span><h3>${c[0]}</h3><div class="card-foot"><span>${c[2]}</span><span>•••</span></div></article>`).join('')}</div></section>`).join('');bind()}function bind(){document.querySelectorAll('.card').forEach(card=>card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',JSON.stringify({column:card.dataset.column,index:card.dataset.index}));card.classList.add('dragging')}));document.querySelectorAll('.card').forEach(c=>c.addEventListener('dragend',()=>c.classList.remove('dragging')));document.querySelectorAll('.cards').forEach(zone=>{zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drop')});zone.addEventListener('dragleave',()=>zone.classList.remove('drop'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drop');const from=JSON.parse(e.dataTransfer.getData('text/plain')),to=zone.closest('.column').dataset.column;const [card]=state[from.column].splice(from.index,1);state[to].push(card);localStorage.setItem('flowboard',JSON.stringify(state));render()})})}document.querySelector('#add').onclick=()=>{const title=prompt('Card title');if(title){state.todo.unshift([title,'engineering','New']);localStorage.setItem('flowboard',JSON.stringify(state));render()}};const app=document.querySelector('#app'),login=document.querySelector('#login');function auth(){const ok=localStorage.getItem('flowboard-user');app.style.display=ok?'block':'none';login.classList.toggle('active',!ok)}document.querySelector('#login-form').onsubmit=e=>{e.preventDefault();localStorage.setItem('flowboard-user','demo');auth()};document.querySelector('#signout').onclick=()=>{localStorage.removeItem('flowboard-user');auth()};auth();render();
</script></body></html>
